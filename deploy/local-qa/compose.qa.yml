name: dataflow-localqa
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dataflow-localqa-mssql
    environment:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?required}
    ports: ["127.0.0.1:11433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]
    mem_limit: 2304m
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
    labels: &qa-labels
      com.dataflow.role: local-qa
      com.dataflow.owner: dataflow-localqa
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql: {condition: service_healthy}
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?required}
      QA_SEED_PASSWORD: ${QA_SEED_PASSWORD:?required}
      QA_READER_PASSWORD: ${QA_READER_PASSWORD:?required}
    volumes:
      - ./sql:/qa/sql:ro
    entrypoint: ["/bin/bash", "/qa/sql/init-mssql.sh"]
    labels: *qa-labels
  postgres:
    image: postgres:16-alpine
    container_name: dataflow-localqa-postgres
    environment:
      POSTGRES_DB: dataflow_qa
      POSTGRES_USER: dataflow_qa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:15433:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataflow_qa -d dataflow_qa"]
      interval: 3s
      timeout: 3s
      retries: 30
    labels: *qa-labels
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: dataflow-localqa-clickhouse
    environment:
      CLICKHOUSE_DB: scratch
      CLICKHOUSE_USER: qa_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:18123:8123"]
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --user=qa_admin --password=\"$$CLICKHOUSE_PASSWORD\" http://localhost:8123/ping | grep -q Ok"]
      interval: 3s
      timeout: 3s
      retries: 30
    labels: *qa-labels
  clickhouse-init:
    image: clickhouse/clickhouse-server:25.3
    depends_on:
      clickhouse: {condition: service_healthy}
    environment:
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?required}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?required}
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:?required}
    volumes:
      - ./sql:/qa/sql:ro
    entrypoint: ["/bin/bash", "/qa/sql/init-clickhouse.sh"]
    labels: *qa-labels
  api:
    profiles: ["operator"]
    build:
      context: ../..
      dockerfile: deploy/local-qa/Dockerfile.api
      secrets: [proxy_ca]
    depends_on:
      postgres: {condition: service_healthy}
      mssql-init: {condition: service_completed_successfully}
      clickhouse-init: {condition: service_completed_successfully}
    environment:
      DATAFLOW_POSTGRES_DSN: postgres://dataflow_qa:${POSTGRES_PASSWORD}@postgres:5432/dataflow_qa?sslmode=disable
      DATAFLOW_SQLSERVER_DSN: sqlserver://qa_erp_reader:${QA_READER_PASSWORD}@mssql:1433?database=DataFlowFixtureQA&encrypt=true&TrustServerCertificate=true
      DATAFLOW_CH_URL: http://clickhouse:8123
      DATAFLOW_CH_USER: qa_dbt_writer
      DATAFLOW_CH_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD}
      DATAFLOW_CH_READONLY_USER: qa_ro
      DATAFLOW_CH_READONLY_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
      DATAFLOW_API_TOKEN: ${DATAFLOW_LIVE_API_TOKEN:-}
      DATAFLOW_ALLOW_TEST_LOAD: "true"
      DATAFLOW_ENABLE_MANAGED_TEST: "true"
      DATAFLOW_ENABLE_SQL_JOBS_TEST: "true"
      DATAFLOW_ENABLE_DBT_TEST: "true"
      DATAFLOW_ENABLE_AUTO_BUILD_TEST: "true"
      DATAFLOW_ENABLE_SAFE_TABLE_TEST: "true"
      DATAFLOW_ENABLE_CORE_PIPELINE_TEST: "true"
      DATAFLOW_TEST_TARGET_DATABASE: scratch
      NO_PROXY: clickhouse,postgres,mssql,127.0.0.1,localhost
    ports: ["127.0.0.1:18080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 4s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 600m
    labels: *qa-labels
  web:
    profiles: ["operator"]
    build:
      context: ../..
      dockerfile: deploy/local-qa/Dockerfile.web
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:15173:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 4s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 150m
    labels: *qa-labels
  dbt-worker:
    build:
      context: ../..
      dockerfile: deploy/local-qa/Dockerfile.dbt-worker
      secrets:
        - proxy_ca
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse-init: {condition: service_completed_successfully}
    environment:
      DATAFLOW_POSTGRES_DSN: postgres://dataflow_qa:${POSTGRES_PASSWORD}@postgres:5432/dataflow_qa?sslmode=disable
      DATAFLOW_ALLOW_TEST_LOAD: "true"
      DATAFLOW_ENABLE_DBT_TEST: "true"
      DATAFLOW_ENABLE_SAFE_TABLE_TEST: "true"
      DATAFLOW_ENABLE_INCREMENTAL_TEST: "true"
      DATAFLOW_TEST_TARGET_DATABASE: scratch
      DATAFLOW_DBT_CH_HOST: clickhouse
      DATAFLOW_DBT_CH_PORT: 8123
      DATAFLOW_DBT_CH_USER: qa_dbt_writer
      DATAFLOW_DBT_CH_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD}
      DATAFLOW_DBT_CH_SECURE: "false"
      NO_PROXY: clickhouse,postgres,mssql,127.0.0.1,localhost
      no_proxy: clickhouse,postgres,mssql,127.0.0.1,localhost
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    labels: *qa-labels
networks:
  default:
    name: dataflow-localqa-net
    labels: *qa-labels
volumes:
  mssql-data: {labels: {com.dataflow.role: local-qa, com.dataflow.owner: dataflow-localqa}}
  pg-data: {labels: {com.dataflow.role: local-qa, com.dataflow.owner: dataflow-localqa}}
  ch-data: {labels: {com.dataflow.role: local-qa, com.dataflow.owner: dataflow-localqa}}
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:-/etc/ssl/certs/ca-certificates.crt}

