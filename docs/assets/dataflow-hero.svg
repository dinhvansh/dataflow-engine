<rect x="1" y="18" width="10" height="18" rx="2"/><rect x="20" y="9" width="10" height="27" rx="2"/><rect x="39" y="0" width="10" height="36" rx="2"/></g>
<text x="1241" y="267" fill="#F1FBFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Analytics</text>
<text x="1241" y="283" fill="#9AB6C8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Trusted output</text>
<circle cx="914" cy="235" r="5" fill="#A7EEFF"/><circle cx="1185" cy="236" r="5" fill="#B6FFF1"/>
<path d="M 140 459 H 1300" stroke="#56A6C6" stroke-opacity=".2"/>
</svg>