<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="490" viewBox="0 0 1440 490" role="img" aria-labelledby="title desc">
<title id="title">DataFlow Engine — Data pipelines you can understand and control</title>
<desc id="desc">Dark blue enterprise product banner with a connected visual pipeline showing source data, ingestion, transformation and trusted analytical outputs.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070F1D"/><stop offset=".6" stop-color="#0A2038"/><stop offset="1" stop-color="#0D1730"/></linearGradient>
  <linearGradient id="a" x1="0" x2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient>
  <linearGradient id="pane" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#183852" stop-opacity=".94"/><stop offset="1" stop-color="#0D243B" stop-opacity=".92"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#B1DEEF" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="19"/></filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000D1B" flood-opacity=".5"/></filter>
</defs>
<rect width="1440" height="490" rx="24" fill="url(#bg)"/>
<rect width="1440" height="490" rx="24" fill="url(#grid)"/>
<circle cx="1170" cy="265" r="160" fill="#0B87CE" opacity=".12" filter="url(#glow)"/>
<circle cx="1300" cy="130" r="120" fill="#16B6A6" opacity=".1" filter="url(#glow)"/>
<path d="M 0 400 C 190 320 290 490 500 418 S 900 335 1440 420" stroke="#36C3DD" stroke-opacity=".10" stroke-width="2" fill="none"/>
<!-- brand mark -->
<rect x="92" y="78" width="78" height="78" rx="21" fill="#0B344D" stroke="#2CA3CD" stroke-opacity=".60"/>
<rect x="110" y="98" width="17" height="17" rx="4" fill="#38BDF8"/>
<rect x="137" y="98" width="17" height="17" rx="4" fill="#2DD4BF"/>
<rect x="110" y="125" width="17" height="17" rx="4" fill="#2DD4BF"/>
<path d="M 125 107 H 139 M 146 115 V 125 M 119 115 V 132" stroke="#E2F7FF" stroke-width="2.5" stroke-linecap="round"/>
<text x="190" y="131" fill="#F5FBFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="750" font-size="49" letter-spacing="-1.7">DataFlow</text>
<text x="418" y="130" fill="#6EE7DF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" letter-spacing="2">ENGINE</text>
<rect x="94" y="191" width="124" height="25" rx="12.5" fill="#184B61" stroke="#2F8195"/>
<circle cx="110" cy="203.5" r="4" fill="#2DD4BF"/>
<text x="121" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="650" fill="#B7F5EC">DEV PREVIEW</text>
<text x="94" y="284" fill="#F3FAFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="-.7">From raw ERP data</text>
<text x="94" y="328" fill="url(#a)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-.7">to trustworthy data pipelines.</text>
<text x="95" y="377" fill="#AAC4D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Ingest · Transform · Build dependencies · Publish safely</text>
<text x="95" y="409" fill="#789DB7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Go  /  SQL Server  /  ClickHouse  /  dbt  /  React</text>
<!-- Graph illustration -->
<g filter="url(#shadow)">
<path d="M 845 235 H 897 Q 914 235 914 217 V 176 H 974" stroke="#39BCE8" stroke-width="4" stroke-linecap="round" fill="none"/>
