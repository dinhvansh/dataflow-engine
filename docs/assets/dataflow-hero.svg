<rect x="974" y="269" width="158" height="105" rx="15" fill="url(#pane)" stroke="#249E91"/>
<rect x="1220" y="182" width="155" height="108" rx="15" fill="url(#pane)" stroke="#3EAFA0"/>
</g>
