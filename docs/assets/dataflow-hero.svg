<text x="705" y="286" fill="#9AB6C8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">ERP · SQL Server</text>
<!-- transformation icon -->
<g transform="translate(993 138)" fill="none" stroke="#38BDF8" stroke-linecap="round" stroke-width="2.4">
<rect x="0" y="1" width="28" height="17" rx="4"/><rect x="45" y="1" width="28" height="17" rx="4"/><path d="M28 9 H45 M35 4 L41 9 35 14" /><path d="M8 32 H64"/></g>
