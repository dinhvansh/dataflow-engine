services:
 postgres:
  image: postgres:16-alpine
  restart: unless-stopped
  environment:
   POSTGRES_DB: dataflow
   POSTGRES_USER: dataflow
   POSTGRES_PASSWORD: ${DATAFLOW_PG_PASSWORD:?set DATAFLOW_PG_PASSWORD}
  ports:
   - "127.0.0.1:5433:5432"
  volumes:
   - pgdata:/var/lib/postgresql/data
   - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
  healthcheck:
   test: ["CMD-SHELL","pg_isready -U dataflow -d dataflow"]
   interval: 5s
   retries: 10
volumes:
 pgdata:
