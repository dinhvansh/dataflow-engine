name: SQL Server Disposable Read-Only QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlserver-readonly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sqlserver-readonly:
    name: SQL Server 2022 fixture + SELECT-only integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Disposable, runner-local fixture credentials, never reuse for real SQL.
      MSSQL_SA_PASSWORD: "DFQA_Disposable_SA_2026!"
      QA_SEED_PASSWORD: "DFQA_Disposable_Seed_2026!"
      QA_READER_PASSWORD: "DFQA_Disposable_Read_2026!"
      DATAFLOW_INTEGRATION_MSSQL_ISOLATED: "true"
      DATAFLOW_INTEGRATION_SQLSERVER_DSN: "sqlserver://qa_erp_reader:DFQA_Disposable_Read_2026!@127.0.0.1:11433?database=DataFlowFixtureQA&encrypt=true&TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Provision isolated, loopback-only SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          docker network create --label com.dataflow.owner=dataflow-sqlserver-ci dataflow-sqlserver-ci
          docker run -d --name df-qa-sqlserver \
            --network dataflow-sqlserver-ci --network-alias mssql \
            --label com.dataflow.owner=dataflow-sqlserver-ci \
            -p 127.0.0.1:11433:1433 --memory=3072m --cpus=2 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer \
            -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest
          ready=0
          for i in $(seq 1 75); do
            if docker exec df-qa-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -C -b -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
              -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "Disposable SQL Server did not become healthy" >&2
            exit 1
          fi
          test "$(docker inspect -f '{{index .Config.Labels "com.dataflow.owner"}}' df-qa-sqlserver)" = dataflow-sqlserver-ci
      - name: Seed the existing disposable ERP-like fixture
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network dataflow-sqlserver-ci \
            -v "$PWD/deploy/local-qa/sql:/qa/sql:ro" \
            -e MSSQL_SA_PASSWORD -e QA_SEED_PASSWORD -e QA_READER_PASSWORD \
            --entrypoint /bin/bash \
            mcr.microsoft.com/mssql/server:2022-latest /qa/sql/init-mssql.sh
      - name: Test real SQL driver, SELECT grants, snapshot and rowversion
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/connectors/sqlserver \
            -run 'Test(DisposableSQLServerReadOnlyIntegration|SnapshotReaderSQLServerIntegration|KeySnapshotBinaryRowVersionSQLServerIntegration)$' \
            -count=1 -timeout=3m -v
      - name: Start disposable PostgreSQL for scoped TEST grants
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name df-qa-test-pg -p 127.0.0.1:5434:5432 -e POSTGRES_DB=dataflow_test_ci -e POSTGRES_USER=dataflow_test_ci -e POSTGRES_PASSWORD=ci-pg-scope-password postgres:16-alpine
          for i in $(seq 1 50); do
            if docker exec df-qa-test-pg pg_isready -U dataflow_test_ci -d dataflow_test_ci >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec df-qa-test-pg pg_isready -U dataflow_test_ci -d dataflow_test_ci
      - name: Test verified TEST grant and real read-only SQL driver session
        shell: bash
        env:
          DATAFLOW_INTEGRATION_POSTGRES_DSN: "postgres://dataflow_test_ci:ci-pg-scope-password@127.0.0.1:5434/dataflow_test_ci?sslmode=disable"
          DATAFLOW_INTEGRATION_PG_ISOLATED: "true"
        run: |
          set -euo pipefail
          go test ./internal/connections -run '^TestScopedSQLServerSessionIntegration$' -count=1 -timeout=4m -v
      - name: Start REAL disposable ClickHouse scratch for end-to-end core QA
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name df-qa-e2e-clickhouse \
            --memory=1792m --cpus=1 \
            -p 127.0.0.1:18123:8123 \
            -e CLICKHOUSE_DB=scratch \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD=qa-disposable-clickhouse-password \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:25.3
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 -u default:qa-disposable-clickhouse-password http://127.0.0.1:18123/ping >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
      - name: Real SQL Server SELECT-only → bounded engine → ClickHouse DQ and publish E2E
        shell: bash
        env:
          DATAFLOW_INTEGRATION_CH_URL: "http://127.0.0.1:18123"
          DATAFLOW_INTEGRATION_CH_USER: "default"
          DATAFLOW_INTEGRATION_CH_PASSWORD: "qa-disposable-clickhouse-password"
          DATAFLOW_INTEGRATION_CH_ISOLATED: "true"
        run: |
          set -euo pipefail
          go test ./internal/engine -run '^TestRealSQLServerToClickHousePublishIntegration$' -count=1 -timeout=4m -v
      - name: CORE-RUN-1 authenticated HTTP → durable PostgreSQL queue → REAL SQL Server → ClickHouse
        shell: bash
        env:
          DATAFLOW_INTEGRATION_PG_ISOLATED: "true"
          DATAFLOW_INTEGRATION_POSTGRES_DSN: "postgres://dataflow_test_ci:ci-pg-scope-password@127.0.0.1:5434/dataflow_test_ci?sslmode=disable"
          DATAFLOW_INTEGRATION_CH_ISOLATED: "true"
          DATAFLOW_INTEGRATION_CH_URL: "http://127.0.0.1:18123"
          DATAFLOW_INTEGRATION_CH_USER: "default"
          DATAFLOW_INTEGRATION_CH_PASSWORD: "qa-disposable-clickhouse-password"
        run: |
          set -euo pipefail
          go test ./cmd/dataflow -run '^TestCoreRun1RealHTTPManagedPipelineIntegration$' -count=1 -timeout=4m -v
      - name: CORE-RUN-2 real partial INSERT → expired lease → fenced recovery → bounded retry
        shell: bash
        env:
          DATAFLOW_INTEGRATION_PG_ISOLATED: "true"
          DATAFLOW_INTEGRATION_POSTGRES_DSN: "postgres://dataflow_test_ci:ci-pg-scope-password@127.0.0.1:5434/dataflow_test_ci?sslmode=disable"
          DATAFLOW_INTEGRATION_CH_ISOLATED: "true"
          DATAFLOW_INTEGRATION_CH_URL: "http://127.0.0.1:18123"
          DATAFLOW_INTEGRATION_CH_USER: "default"
          DATAFLOW_INTEGRATION_CH_PASSWORD: "qa-disposable-clickhouse-password"
        run: |
          set -euo pipefail
          go test ./cmd/dataflow -run '^TestCoreRun2RealCrashRetryCheckpointIntegration$' -count=1 -timeout=4m -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned real dbt Core and ClickHouse adapter for CORE-RUN-3
        run: python -m pip install 'dbt-core==1.11.0' 'dbt-clickhouse==1.10.3'
      - name: CORE-RUN-3 REAL authenticated operator SQL Server to dbt A-B-C DQ Publish
        shell: bash
        env:
          DATAFLOW_INTEGRATION_PG_ISOLATED: "true"
          DATAFLOW_INTEGRATION_POSTGRES_DSN: "postgres://dataflow_test_ci:ci-pg-scope-password@127.0.0.1:5434/dataflow_test_ci?sslmode=disable"
          DATAFLOW_INTEGRATION_CH_ISOLATED: "true"
          DATAFLOW_INTEGRATION_CH_URL: "http://127.0.0.1:18123"
          DATAFLOW_INTEGRATION_CH_USER: "default"
          DATAFLOW_INTEGRATION_CH_PASSWORD: "qa-disposable-clickhouse-password"
          DATAFLOW_INTEGRATION_DBT_BIN: "dbt"
        run: |
          set -euo pipefail
          go test ./cmd/dataflow -run '^TestCoreRun3UnifiedRealFourServiceIntegration$' -count=1 -timeout=7m -v
      - name: Failure diagnostics (disposable SQL Server only)
        if: failure()
        shell: bash
        run: |
          docker logs df-qa-sqlserver --tail 70 2>/dev/null || true
