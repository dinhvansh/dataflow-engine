name: Core Run 7 Benchmark Contract (no fake 7m CI)
on:
  pull_request:
    paths:
      - "cmd/dataflow/core_run7m_benchmark_integration_test.go"
      - "deploy/local-qa/run-core-7m.sh"
      - ".github/workflows/core-run7-contract.yml"
      - "docs/CORE_RUN7_BENCHMARK_ACCEPTANCE.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark-contract-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and explicit opt-in guard
        run: |
          bash -n deploy/local-qa/run-core-7m.sh
          python3 - <<'PY'
          from pathlib import Path
          x=Path("deploy/local-qa/run-core-7m.sh").read_text()
          y=Path("cmd/dataflow/core_run7m_benchmark_integration_test.go").read_text()
          assert "YES_I_ACCEPT_DISPOSABLE_QA_SEEDING" in x
          assert "QA_REAL_7M_BENCH_PASS" in x and "QA_REAL_7M_INCREMENTAL_REPLAY_PASS" in x
          assert "CountRunRows" in y and "generation" in y
          print("Contract valid — no 7m data has been generated by CI")
          PY
