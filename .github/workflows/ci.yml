name: CI
on:
  push:
    branches:
      - main
  pull_request:
# Always test open PRs, but avoid duplicate branch push runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
      - name: QA disk guard regression (no Docker teardown)
        run: bash deploy/local-qa/check-disk-capacity_test.sh
      - name: Go unit and race tests
        run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Start isolated ClickHouse
        run: |
          docker run -d --name df-clickhouse -p 127.0.0.1:8123:8123 -e CLICKHOUSE_DB=scratch -e CLICKHOUSE_USER=default -e CLICKHOUSE_PASSWORD=ci-test-password -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 clickhouse/clickhouse-server:25.3
          for i in $(seq 1 60); do
            if curl -fsS -u default:ci-test-password http://127.0.0.1:8123/ping >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -u default:ci-test-password http://127.0.0.1:8123/ping
      - name: ClickHouse ingestion and SQL integration
        env:
          DATAFLOW_INTEGRATION_CH_URL: http://127.0.0.1:8123
          DATAFLOW_INTEGRATION_CH_USER: default
          DATAFLOW_INTEGRATION_CH_PASSWORD: ci-test-password
        run: |
          go test ./internal/connectors/clickhouse -run Integration -count=1 -v
          go test ./internal/transform -run Integration -count=1 -v
          go test ./internal/safetable -run 'Test(AtomicPublishAndRollbackIntegration|DeltaUpdateDeleteReplayIntegration|DeltaRejectDuplicateVersionIntegration|DeltaHistoryDetectsOldVersionAppendIntegration)$' -count=1 -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install version-pinned dbt Core and ClickHouse adapter
        run: python -m pip install 'dbt-core==1.11.0' 'dbt-clickhouse==1.10.3'
      - name: Materialize a REAL scratch ClickHouse View through dbt
        env:
          DATAFLOW_INTEGRATION_CH_URL: http://127.0.0.1:8123
          DATAFLOW_INTEGRATION_CH_USER: default
          DATAFLOW_INTEGRATION_CH_PASSWORD: ci-test-password
          DATAFLOW_INTEGRATION_DBT_BIN: dbt
        run: go test ./internal/dbtworker -run TestDBTRealClickHouseIntegration -count=1 -v
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --name df-postgres -p 127.0.0.1:5433:5432 -e POSTGRES_DB=dataflow_ci -e POSTGRES_USER=dataflow_ci -e POSTGRES_PASSWORD=ci-postgres-password postgres:16-alpine
          for i in $(seq 1 40); do
            if docker exec df-postgres pg_isready -U dataflow_ci -d dataflow_ci >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec df-postgres pg_isready -U dataflow_ci -d dataflow_ci
      - name: Provision isolated read-only ClickHouse user
        run: |
          curl --fail-with-body -sS -u default:ci-test-password --data-binary "CREATE USER IF NOT EXISTS dataflow_reader IDENTIFIED WITH sha256_password BY 'ci-read-password'" http://127.0.0.1:8123/
          curl --fail-with-body -sS -u default:ci-test-password --data-binary "GRANT SELECT ON scratch.* TO dataflow_reader" http://127.0.0.1:8123/
          curl -fsS -u dataflow_reader:ci-read-password --data-binary "SELECT 1" http://127.0.0.1:8123/
      - name: PostgreSQL and ClickHouse integration
        env:
          DATAFLOW_INTEGRATION_POSTGRES_DSN: postgres://dataflow_ci:ci-postgres-password@127.0.0.1:5433/dataflow_ci?sslmode=disable
          DATAFLOW_INTEGRATION_PG_ISOLATED: "true"
          DATAFLOW_INTEGRATION_CH_URL: http://127.0.0.1:8123
          DATAFLOW_INTEGRATION_CH_USER: dataflow_reader
          DATAFLOW_INTEGRATION_CH_PASSWORD: ci-read-password
          DATAFLOW_INTEGRATION_CH_WRITER_USER: default
          DATAFLOW_INTEGRATION_CH_WRITER_PASSWORD: ci-test-password
          DATAFLOW_INTEGRATION_DBT_BIN: dbt
        run: |
          go test ./cmd/dataflow -run 'Test(ManagedQueueIntegration|SQLDAGIntegration|TransformStudioIntegration|DBTRunAPIIntegration|LineageAPIIntegration|SafeTableAPIIntegration|AutoBuildRealDBTIntegration|SafeIncrementalAPIIntegration|HardDeleteRejectsStaleSnapshotIntegration)$' -count=1 -v
          go test ./cmd/dataflow-dbt-worker -run 'Test(DBTQueueIntegration|DBTFullQueueIntegration|SafeTableFullIntegration|SafeIncrementalFullIntegration)$' -count=1 -v
          go test ./internal/connections -run 'Test(ConnectionCatalogIntegration|SecureViewHTTPIntegration)
      - name: Build isolated dbt worker Docker image
        run: docker build -f deploy/dbt-worker/Dockerfile -t dataflow-dbt-worker:ci .
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs df-clickhouse --tail 100 || true
          docker logs df-postgres --tail 100 || true
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
 -count=1 -v
      - name: Build isolated dbt worker Docker image
        run: docker build -f deploy/dbt-worker/Dockerfile -t dataflow-dbt-worker:ci .
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs df-clickhouse --tail 100 || true
          docker logs df-postgres --tail 100 || true
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
