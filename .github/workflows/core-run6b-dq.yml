name: Core Run 6B REAL DQ Failure and Concurrent API
on:
  pull_request:
    paths:
      - "qa/browser/test_core_negative_dq_live.py"
      - "deploy/local-qa/run-core-6b-dq.sh"
      - ".github/workflows/core-run6b-dq.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-6b-dq-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  core-real-negative-dq:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATAFLOW_QA_MIN_FREE_BYTES: "4294967296"
      DATAFLOW_LIVE_QA_OPT_IN: "true"
      DATAFLOW_CORE_6B_DQ_OPT_IN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA test runtime and check scripts
        run: |
          python -m pip install 'pytest==8.4.2' 'playwright==1.56.0'
          python -m py_compile qa/browser/test_core_negative_dq_live.py
          bash -n deploy/local-qa/run-core-6b-dq.sh
      - name: Boot labeled disposable SQL Server PG ClickHouse fixtures
        run: bash deploy/local-qa/up.sh
      - name: Real concurrent HTTP and real negative DQ fail-closed
        run: bash deploy/local-qa/run-core-6b-dq.sh
      - name: Persist sanitized real DB and DQ evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-run6b-concurrent-dq-evidence
          path: qa-results/core-run6b-dq/
          if-no-files-found: warn
          retention-days: 14
