name: Core Run 6B REAL Mid-SQL Kill and Publish Race
on:
  pull_request:
    paths:
      - "cmd/dataflow/core_runs.go"
      - "cmd/dataflow-dbt-worker/**"
      - "qa/browser/test_core_mid_sql_live.py"
      - "deploy/local-qa/run-core-mid-sql.sh"
      - ".github/workflows/core-run6b-mid-sql.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-run6b-mid-sql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-mid-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATAFLOW_QA_MIN_FREE_BYTES: "4294967296"
      DATAFLOW_LIVE_QA_OPT_IN: "true"
      DATAFLOW_CORE_MID_SQL_OPT_IN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Pinned QA dependencies and static checks
        run: |
          python -m pip install 'pytest==8.4.2' 'playwright==1.56.0'
          python -m py_compile qa/browser/test_core_mid_sql_live.py
          bash -n deploy/local-qa/run-core-mid-sql.sh
      - name: Boot owned disposable DB services
        run: bash deploy/local-qa/up.sh
      - name: Real active ClickHouse SQL query SIGKILL / lease replay / publish
        run: bash deploy/local-qa/run-core-mid-sql.sh
      - name: Archive only synthetic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-run6b-mid-sql-evidence
          path: qa-results/core-run6b3/
          if-no-files-found: warn
          retention-days: 14
